<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoP Project - Ranking</title>
</head>
<style>
@import url('/css/utils.css');
body {
    margin: 0;
    font-family: "Poppins", sans-serif;
}
main {
    width: 100vw;
    height: 100vh;
    background-image: url('/capas/capa-horizontal.png');
    background-size: cover;
    background-position: center;
    position: fixed;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
#titulo {
    width: 40%;
    display: flex;
    flex-direction: column;
    align-items: center;
}
#titulo h1 {
    margin: 0;
    color: #fff;
    text-align: center;
    font-size: 48px;
    margin-top: 10vh;
}
#subtitulo {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    font-style: italic;
}
#ranking {
    width: 30%;
    height: 50%;
    padding: 4vh 5vw;
    overflow-y: auto;
    scrollbar-width: none;

    mask-image: linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

    -webkit-mask-image: linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );
}
.jogador {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 10px 40px;
    border: 4px solid #fff;
    border-radius: 0px 30px;
    color: #fff;
    margin-bottom: 15px;
}
.jogador h4,  .jogador p {
    margin: 0;
} 
.jogador div {
    display: inherit;
    flex-direction: column;
}
.jogador div h4 {
    font-size: 22px;
}
.jogador div p {
    font-size: 14px;
    margin-left: 15px;
    font-weight: 400;
    font-style: italic;
    color: #ccc;
}
#pontos {
    color: var(--primary);
    font-size: 26px;
    font-weight: 800;
}

@media (max-width: 1024px) {
    main {
        background-image: url('/capas/capa-vertical.png');
        background-position: bottom;
        width: 100vw;
    }

    #titulo, #ranking {
        width: 100%;
    }
    
    #ranking {
        padding-inline: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .jogador {
        width: 60%;
    }

    h1 {
        margin-top: 30vh;
    }
}
</style>
<body>
    <main>
        <div id="titulo">
            <h1>LoP Project</h1>
            <div id="subtitulo">
                <p>Ranking</p>
            </div>
        </div>
        <div id="ranking">
        </div>
    </main>
    <script src="/js/carregarRanking.js"></script>
</body>
</html>
