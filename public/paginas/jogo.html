<html lang="pt-BR">
<head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script type="module" src="/js/jogo.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/jogo.css">
    <title>Projeto LoP - 2.0</title>
</head>
<body>
    <div id="container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
    </div>
    <div id="pontos">
        <i class="fa-solid fa-coins"></i>
        <p>0</p>
    </div>
    
    <a-scene gestos-input physics="debug: false" id="cena">
        <a-assets>
            <img id="grama" src="/assets/grama-02.png">
            <img id="ceu" src="/assets/sky.jpg">
            <img id="roda" src="/assets/roda.png">
            <img id="janela" src="/assets/gradiente-janelas.png">
            <img id="muro" src="/assets/muro.jpg">
            <img id="moeda" src="/assets/moeda.png">
            <audio id="somMoeda" src="/assets/moeda.mp3"></audio>
        </a-assets>
        <a-box
            position="0 0.75 0"
            scale="5 1 2"
            dynamic-body="mass: 1"
            mycar
            material="color: red;"   
            id="carro"
        >
            <a-cylinder
                class="roda"
                scale="0.3 1.1 0.093"
                position="0.3 -0.48 0"
                rotation="0 90 90"
                material="src: #roda"
            ></a-cylinder>
            <a-cylinder
                class="roda"
                scale="0.3 1.1 0.093"
                position="-0.3 -0.48 0"
                rotation="0 90 90"
                material="src: #roda"
            ></a-cylinder>
            <a-box
                scale="0.6 1 1"
                position="0.1 1 0"
                material="color: red;"
            >
                <a-box scale="0.9 0.9 0.1" position="-0.46 0 0" rotation="0 90 0" material="color: #c4c4c4; src: #janela"></a-box>
                <a-box scale="0.7 0.4 0.1" position="0.46 0 0" rotation="0 90 0" material="color: #c4c4c4; src: #janela"></a-box>
                <a-box scale="0.9 0.9 0.1" position="0 0 0.46" rotation="0 0 0" material="color: #c4c4c4; src: #janela"></a-box>
                <a-box scale="0.9 0.9 0.1" position="0 0 -0.46" rotation="0 0 0" material="color: #c4c4c4; src: #janela"></a-box>
                <a-box scale="1.05 1 0.1" position="0 0 0" rotation="0 90 0" material="color: red"></a-box>
                <a-box scale="1.05 1.05 0.1" position="0 0.46 0" rotation="90 0 0" material="color: red"></a-box>
            </a-box>
            <a-box
                scale="0.9 0.3 0.01"
                position="-0.5 0.2 0"
                rotation="0 90 0"
                material="color: #fff; src: #janela"
            >
                <a-box scale="0.2 1 1.2" position="0.4 0 0" material="color: #FFC006"></a-box>
                <a-box scale="0.2 1 1.2" position="-0.4 0 0" material="color: #FFC006"></a-box>
            </a-box>
            <a-entity id="camera1" camera="active:true" look-controls="enabled:false" wasd-controls="enabled:false" position="0 2 10">
                <a-text
                    id="velocimetro"
                    value="0 km/h"
                    color="#FFF"
                    align="center"
                    width="1"
                    position="0 -0.5 -1"
                ></a-text>
            </a-entity>
        </a-box>
        
        <a-entity 
            geometry="primitive: plane; width: 500; height: 500"
            position="0 0 10" 
            rotation="-90 0 0" 
            material="color: #00ff00;
                        src: #grama;
                        repeat: 20 30;
                        normalMap: #grama;
                        normalTextureRepeat: 20 30;"
            static-body
        >
        </a-entity>
        <a-box scale="2 20 500" position="250 0 10" material="color: #ccc; src: #muro; repeat: 100 3" static-body></a-box>
        <a-box scale="2 20 500" position="-250 0 10" material="color: #ccc; src: #muro; repeat: 100 3" static-body></a-box>
        <a-box scale="2 20 500" position="0 0 260" rotation="0 90 0" material="color: #ccc; src: #muro; repeat: 100 3" static-body></a-box>
        <a-box scale="2 20 500" position="0 0 -240" rotation="0 90 0" material="color: #ccc; src: #muro; repeat: 100 3" static-body></a-box>

        <a-sky 
            src="#ceu"
            radius="600"
        ></a-sky>
    </a-scene>
</body>

</html>
